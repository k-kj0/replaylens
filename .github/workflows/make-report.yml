name: make-big-report
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/make_big_report.py 5000
      - uses: actions/upload-artifact@v4
        with:
          name: big_report
          path: big_report.json
