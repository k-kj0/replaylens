name: canary

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = print dataset shape, test = run tests only, run = full canary run"
        type: choice
        options: [run, inspect, test]
        default: run

permissions:
  contents: write
  issues: write

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Canary tests
        run: python -m pytest tests/test_canary.py -q

      - name: Inspect dataset shape
        if: github.event.inputs.mode == 'inspect'
        run: python -m canary inspect

      - name: Run canary
        if: github.event.inputs.mode != 'inspect' && github.event.inputs.mode != 'test'
        run: python -m canary run

      - name: Check for drift
        id: check
        if: github.event.inputs.mode != 'inspect' && github.event.inputs.mode != 'test'
        run: |
          set +e
          python -m canary check
          code=$?
          cat canary/data/last_check.md >> "$GITHUB_STEP_SUMMARY"
          python -m canary aa >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 2 ]; then echo "drift=yes" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Save results
        if: github.event.inputs.mode != 'inspect' && github.event.inputs.mode != 'test'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add canary/data/results.jsonl
          git diff --cached --quiet || (git commit -m "canary: add run" && git pull --rebase && git push)

      - name: Open an issue if drift was found
        if: steps.check.outputs.drift == 'yes'
        run: |
          gh label create canary --force
          open=$(gh issue list --label canary --state open --json number --jq length)
          if [ "$open" -eq 0 ]; then
            gh issue create --label canary --title "Canary drift detected" --body-file canary/data/last_check.md
          fi
