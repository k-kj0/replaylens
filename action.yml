name: "ReplayLens regression gate"
description: "Replay recorded agent runs against a new prompt or model and fail the build if the agent regresses."
author: "k-kj0"

branding:
  icon: rewind
  color: blue

inputs:
  runs:
    description: "Path to the recorded runs file, relative to the repository workspace"
    required: true

  agent:
    description: "Agent import path, e.g. examples.refund_bot:run_agent"
    required: true

  prompt:
    description: "Path to the prompt file to test"
    required: true

  rules:
    description: "Path to a rules JSON file, if applicable"
    required: false
    default: ""

  mock:
    description: "Use the built-in mock model instead of a real endpoint"
    required: false
    default: "false"

  python-version:
    description: "Python version"
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install ReplayLens
      shell: bash
      env:
        REPLAYLENS_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        python -m pip install "$REPLAYLENS_ACTION_PATH"

    - name: Replay and check for regressions
      shell: bash
      env:
        REPLAYLENS_RUNS: ${{ inputs.runs }}
        REPLAYLENS_AGENT: ${{ inputs.agent }}
        REPLAYLENS_PROMPT: ${{ inputs.prompt }}
        REPLAYLENS_RULES: ${{ inputs.rules }}
        REPLAYLENS_MOCK: ${{ inputs.mock }}
        PYTHONPATH: ${{ github.workspace }}
      run: |
        set -euo pipefail

        args=(
          replay
          "$REPLAYLENS_RUNS"
          --agent "$REPLAYLENS_AGENT"
          --prompt "$REPLAYLENS_PROMPT"
          --fail-on-regression
        )

        if [[ -n "$REPLAYLENS_RULES" ]]; then
          args+=(--rules "$REPLAYLENS_RULES")
        fi

        if [[ "$REPLAYLENS_MOCK" == "true" ]]; then
          args+=(--mock)
        fi

        python -m replaylens "${args[@]}"
